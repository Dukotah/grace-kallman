<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Kallman | Composer, Songwriter, Producer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
  :root{
  --red:#8e0000;
--red-dark:#6f0000;
--black:#0d0d0d;
--white:#ffffff;
  --serif:'Cormorant Garamond', Georgia, serif;
--sans:'Montserrat', Arial, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--white);background:var(--black)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
  header{position:sticky;top:0;z-index:100;background:var(--red);display:flex;align-items:center;justify-content:space-between;padding:14px 40px}
.logo{font-family:var(--serif);font-size:1.3rem;letter-spacing:2px;line-height:1.1}
nav ul{list-style:none;display:flex;gap:34px}
nav a{font-size:.8rem;letter-spacing:2px;transition:opacity .2s}
nav a:hover{opacity:.7}
.hero{position:relative;min-height:92vh;background:#111 url('images/hero.jpg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;padding:0 8vw}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.15));z-index:1}
.hero-inner{position:relative;z-index:2}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(3rem,9vw,7rem);letter-spacing:.12em;line-height:1.05}
.hero p{margin-top:14px;font-size:clamp(.7rem,1.6vw,1rem);letter-spacing:.35em}
.hero-btns{margin-top:28px;display:flex;gap:18px;justify-content:flex-end}
.btn{border:1px solid #fff;padding:12px 26px;font-size:.75rem;letter-spacing:2px;transition:.2s}
.btn:hover{background:#fff;color:var(--black)}
  .section-title{font-family:var(--serif);font-weight:500;font-size:clamp(2.5rem,6vw,4.5rem);letter-spacing:.08em;text-align:center}
.music{padding:70px 6vw 90px;background:var(--black)}
.music .section-title{margin-bottom:40px}
  .player{max-width:820px;margin:0 auto 60px;background:#1b1b1b;border-radius:8px;padding:26px 30px}
.track-cat{font-family:var(--sans);font-weight:600;letter-spacing:2px;margin:26px 0 6px;color:#ddd}
.track{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333;font-size:.95rem;font-weight:300}
.track span:last-child{color:#aaa}
.video-wrap{max-width:820px;margin:0 auto}
.video-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:6px}
.about{display:grid;grid-template-columns:1fr 1fr;background:var(--red)}
.about-text{padding:70px 5vw}
.about-text h2{font-family:var(--serif);font-weight:500;font-size:clamp(2.5rem,5vw,4rem);letter-spacing:.06em;margin-bottom:28px}
.about-text p{font-size:.98rem;line-height:1.75;font-weight:300;margin-bottom:18px}
.about-text strong{font-weight:600}
.about-text em{font-style:italic}
.about-img{background:#300 url('images/about.jpg') center/cover no-repeat;min-height:480px}
.contact{position:relative;text-align:center;padding:90px 20px;background:#111 url('images/contact.jpg') center/cover no-repeat}
.contact::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6)}
.contact>*{position:relative;z-index:2}
.contact h2{font-family:var(--serif);font-weight:500;font-size:clamp(2.5rem,6vw,4.5rem);letter-spacing:.08em;margin-bottom:24px}
.contact a.email{font-size:1.05rem;letter-spacing:1px}
.divider{width:260px;height:1px;background:#fff;opacity:.5;margin:34px auto}
.social{display:flex;gap:26px;justify-content:center;margin-bottom:30px}
.social a{width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:.2s}
.social a:hover{opacity:.6}
.social svg{width:26px;height:26px;fill:#fff}
footer{text-align:center;padding:22px;font-size:.8rem;letter-spacing:1px;color:#ddd;background:#111;position:relative;z-index:2}
@media(max-width:760px){
header{padding:12px 18px;flex-direction:column;gap:10px}
nav ul{gap:20px}
.hero{align-items:center;text-align:center}
.hero-btns{justify-content:center}
  .about{grid-template-columns:1fr}
.about-img{min-height:320px;order:-1}
         }
</style>
  </head>
  <body>
